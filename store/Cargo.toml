[package]
name = "store"
version = "0.1.0"
authors = ["Alberto Sonnino <alberto@sonnino.com>"]
edition = "2018"
publish = false

[dependencies]
rocksdb = { version = "0.21.0", default-features = false }
# librocksdb-sys defaults include `static`, which forces libz-sys to compile bundled zlib
# (Z_SOLO + NULL=0) and can fail on CloudLab/gcc with empty cc stderr. Disabling
# librocksdb-sys default features keeps zlib/bzip2 optional and uses system libs when enabled.
librocksdb-sys = { version = "0.11.0", default-features = false }
tokio = { version = "1.5.0", features = ["sync", "macros", "rt"] }
